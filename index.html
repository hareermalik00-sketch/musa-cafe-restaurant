        :root {

        html { scroll-behavior: smooth; }

            color: var(--text);
            overflow-x: hidden;
            line-height: 1.6;
        }
        
        /* 3D Canvas */
        #bg-canvas {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: var(--dark); }
        ::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }
        
        /* ===== NAVIGATION ===== */
        .side-nav {
            position: fixed; right: 0; top: 0;
            height: 100vh; width: 70px;
            z-index: 1000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 2rem;
            background: linear-gradient(to left, rgba(10,10,10,0.9), transparent);
            padding: 2rem 0;
        }
        .side-nav a {
            writing-mode: vertical-rl;
            text-orientation: mixed;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.3s;
            font-weight: 500;
        }
        .side-nav a:hover, .side-nav a.active { color: var(--gold); }
        .nav-logo {
            position: fixed; top: 2rem; left: 2.5rem;
            z-index: 1000;
        }
        .nav-logo h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.4rem; font-weight: 600;
            letter-spacing: 4px; color: var(--text);
        }
        .nav-logo span {
            font-size: 0.55rem; letter-spacing: 3px;
            color: var(--gold); text-transform: uppercase;
        }
        .nav-icons {
            position: fixed; top: 2rem; right: 90px;
            z-index: 1000;
            display: flex; gap: 1.2rem;
        }
        .nav-icons button {
            background: none; border: none;
            color: var(--text); font-size: 1.1rem;
            cursor: pointer; transition: color 0.3s;
            position: relative;
        }
        .nav-icons button:hover { color: var(--gold); }
        .cart-badge {
            position: absolute; top: -6px; right: -8px;
            background: var(--gold); color: var(--dark);
            font-size: 0.6rem; width: 16px; height: 16px;
            border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            font-weight: 700; display: none;
        }
        
        /* ===== HERO ===== */
        .hero {
            position: relative; z-index: 1;
            min-height: 100vh;
            display: flex; align-items: center;
            padding: 0 5rem 0 3rem;
            overflow: hidden;
        }
        .hero-bg {
            position: absolute; right: 0; top: 0;
            width: 55%; height: 100%;
            background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?w=1200') center/cover;
            border-radius: 0 0 0 40px;
            opacity: 0.7;
        }
        .hero-bg::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to right, var(--dark), transparent 60%);
        }
        .hero-content {
            position: relative; z-index: 2;
            max-width: 550px;
            animation: fadeInUp 1.2s ease;
        }
        .hero-content .shine {
            font-family: 'Playfair Display', serif;
            font-size: 1rem; color: var(--gold);
            letter-spacing: 4px; text-transform: uppercase;
            margin-bottom: 1rem; display: block;
        }
        .hero-content h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 5vw, 4.5rem);
            font-weight: 400; line-height: 1.1;
            margin-bottom: 1.5rem;
        }
        .hero-content p {
            color: var(--text-dim); font-size: 0.95rem;
            line-height: 1.9; margin-bottom: 2.5rem;
            max-width: 420px;
        }
        .btn-main {
            display: inline-flex; align-items: center; gap: 0.6rem;
            padding: 1rem 2.5rem; background: var(--gold);
            color: var(--dark); border: none;
            border-radius: 4px; font-size: 0.8rem;
            font-weight: 600; letter-spacing: 2px;
            text-transform: uppercase; cursor: pointer;
            transition: all 0.4s; text-decoration: none;
        }
        .btn-main:hover {
            background: var(--gold-light);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(201,169,110,0.25);
        }
        .scroll-indicator {
            position: absolute; bottom: 3rem; left: 50%;
            transform: translateX(-50%);
            display: flex; flex-direction: column;
            align-items: center; gap: 0.5rem;
            color: var(--text-dim); font-size: 0.7rem;
            letter-spacing: 3px; text-transform: uppercase;
            animation: bounce 2s infinite;
        }
        .scroll-indicator i { font-size: 1.2rem; color: var(--gold); }
        
        /* ===== DISCOVER / EDEN SPACE ===== */
        .discover {
            position: relative; z-index: 1;
            min-height: 100vh; display: flex;
            align-items: center; padding: 6rem 5rem 6rem 3rem;
            gap: 4rem;
        }
        .discover-img {
            flex: 1; height: 500px;

            position: relative;
        }
        .discover-img img {
            width: 100%; height: 100%; object-fit: cover;
            transition: transform 0.8s;
        }
        .discover-img:hover img { transform: scale(1.05); }
        .discover-img::after {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(10,10,10,0.6), transparent);
        }
        .discover-content {
            flex: 1; max-width: 500px;
        }
        .discover-content .label {
            font-size: 0.75rem; letter-spacing: 4px;
            text-transform: uppercase; color: var(--gold);
            margin-bottom: 1rem; display: block;
        }
        .discover-content h2 {
            font-family: 'Playfair Display', serif;

        .info-box div { font-size: 0.8rem; }
        .info-box div strong { color: var(--text); display: block; }
        .info-box div span { color: var(--text-dim); font-size: 0.75rem; }
        
        /* ===== MENU SECTION ===== */
        .menu-section {
            position: relative; z-index: 1;
            padding: 5rem 3rem 5rem 3rem;
        }
        .section-header {
            text-align: center; margin-bottom: 3rem;
        }
        .section-header .label {
            font-size: 0.75rem; letter-spacing: 4px;
            text-transform: uppercase; color: var(--gold);
            margin-bottom: 0.8rem; display: block;
        }
        .section-header h2 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 400;
        }
        .menu-categories {
            display: flex; justify-content: center;
            gap: 0.6rem; margin-bottom: 3rem;
            flex-wrap: wrap; padding: 0 2rem;
        }
        .cat-btn {
            padding: 0.5rem 1.2rem;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-dim); border-radius: 30px;
            cursor: pointer; transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem; letter-spacing: 1px;
            text-transform: uppercase;
        }
        .cat-btn:hover, .cat-btn.active {
            background: var(--gold); color: var(--dark);
            border-color: var(--gold);
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem; max-width: 1400px;
            margin: 0 auto;
        }
        .menu-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden;
            transition: all 0.4s; position: relative;
        }
        .menu-item:hover {

        }
        .menu-item-img {

            position: relative;
        }
        .menu-item-img::after {
            content: ''; position: absolute;
            bottom: 0; left: 0; right: 0; height: 60px;
            background: linear-gradient(to top, var(--card), transparent);
        }
        .menu-item-body { padding: 1.3rem; }
        .menu-item h3 {

        .menu-item p {

        .menu-item-footer {

        .menu-price {
