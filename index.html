<style>
/* ==========================================================================
   MUSA CAFE & RESTAURANT — LUXURY 3D CINEMATIC THEME
   Theme: Black / Dark Grey / Golden
   Edit the CSS variables below to adjust the whole palette in one place.
   ========================================================================== */
:root{
  --black:#08090a;
  --grey-1:#111214;
  --grey-2:#191b1e;
  --grey-3:#232529;
  --gold:#c9a24a;
  --gold-bright:#f0cd7a;
  --gold-dim:#7d6530;
  --cream:#efe6d2;
  --cream-dim:#a8a9ad;
  --glass:rgba(239,230,210,0.045);
  --glass-border:rgba(201,162,74,0.28);
  --font-display:'Playfair Display', serif;
  --font-script:'Cormorant Garamond', serif;
  --font-body:'Jost', sans-serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  background:var(--black);
  color:var(--cream);
  font-family:var(--font-body);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
::selection{background:var(--gold);color:var(--black);}
::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-track{background:var(--grey-1);}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:10px;}
a{text-decoration:none;color:inherit;}
ul{list-style:none;}
img{max-width:100%;display:block;}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
.container{width:100%;max-width:1280px;margin:0 auto;padding:0 24px;}
.eyebrow{
  display:inline-flex;align-items:center;gap:10px;
  font-size:12px;letter-spacing:4px;text-transform:uppercase;color:var(--gold);margin-bottom:18px;
}
.eyebrow::before,.eyebrow::after{content:'';width:26px;height:1px;background:var(--gold-dim);}
.section-title{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(30px,5vw,54px);line-height:1.15;color:var(--cream);letter-spacing:.5px;
}
.section-title em{font-style:italic;font-family:var(--font-script);color:var(--gold-bright);font-weight:500;}
.section-sub{font-size:15px;color:var(--cream-dim);max-width:560px;line-height:1.8;margin-top:16px;font-weight:300;}
.section-pad{padding:110px 0;position:relative;}
.gold-line{width:60px;height:2px;background:linear-gradient(90deg,var(--gold),transparent);margin-top:20px;}
.center{text-align:center;margin-left:auto;margin-right:auto;}
.center .gold-line{margin-left:auto;margin-right:auto;}
.center .eyebrow::before,.center .eyebrow::after{display:inline-block;}

/* reveal-on-scroll */
.reveal{opacity:0;transform:translateY(46px);transition:opacity 1s var(--ease),transform 1s var(--ease);}
.reveal.in{opacity:1;transform:translateY(0);}
.reveal-scale{opacity:0;transform:scale(.92);transition:opacity .9s var(--ease),transform .9s var(--ease);}
.reveal-scale.in{opacity:1;transform:scale(1);}

/* ================= PRELOADER ================= */
#preloader{
  position:fixed;inset:0;z-index:9999;background:var(--black);
  display:flex;align-items:center;justify-content:center;flex-direction:column;
  transition:opacity .9s var(--ease),visibility .9s var(--ease);
}
#preloader.hide{opacity:0;visibility:hidden;pointer-events:none;}
.pre-mark{font-family:var(--font-display);font-size:56px;letter-spacing:10px;color:transparent;-webkit-text-stroke:1px var(--gold);animation:preGlow 2s var(--ease) forwards;}
@media(min-width:700px){.pre-mark{font-size:78px;}}
@keyframes preGlow{
  0%{-webkit-text-stroke:1px transparent;opacity:0;letter-spacing:28px;}
  45%{-webkit-text-stroke:1px var(--gold);opacity:1;letter-spacing:10px;}
  100%{color:var(--gold-bright);-webkit-text-stroke:1px var(--gold-bright);text-shadow:0 0 40px rgba(240,205,122,.45);}
}
.pre-sub{letter-spacing:6px;font-size:11px;color:var(--gold-dim);margin-top:16px;opacity:0;animation:preFade 1s ease .7s forwards;}
@keyframes preFade{to{opacity:1;}}
.pre-bar{width:180px;height:1px;background:rgba(201,162,74,.2);margin-top:26px;position:relative;overflow:hidden;}
.pre-bar::after{content:'';position:absolute;left:-100%;top:0;height:100%;width:100%;background:var(--gold);animation:preLoad 1.8s var(--ease) forwards;}
@keyframes preLoad{to{left:0;}}

/* ================= NAV ================= */
header{position:fixed;top:0;left:0;width:100%;z-index:900;padding:26px 0;transition:.5s var(--ease);}
header.scrolled{padding:14px 0;background:rgba(8,9,10,.85);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid rgba(201,162,74,.15);}
nav{display:flex;align-items:center;justify-content:space-between;}
.logo{font-family:var(--font-display);font-size:21px;letter-spacing:2px;color:var(--cream);display:flex;flex-direction:column;line-height:1;}
.logo span{font-size:9px;letter-spacing:4px;color:var(--gold);margin-top:6px;text-transform:uppercase;font-family:var(--font-body);}
.nav-links{display:flex;gap:36px;}
.nav-links a{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--cream-dim);position:relative;padding-bottom:4px;transition:.3s;}
.nav-links a::after{content:'';position:absolute;bottom:0;left:0;width:0;height:1px;background:var(--gold);transition:.4s var(--ease);}
.nav-links a:hover{color:var(--gold-bright);}
.nav-links a:hover::after{width:100%;}
.nav-cta{border:1px solid var(--gold);padding:11px 24px;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold-bright);border-radius:2px;transition:.4s var(--ease);position:relative;overflow:hidden;z-index:1;}
.nav-cta:hover{color:var(--black);}
.nav-cta::before{content:'';position:absolute;inset:0;background:var(--gold);transform:translateY(101%);transition:.4s var(--ease);z-index:-1;}
.nav-cta:hover::before{transform:translateY(0);}
.burger{display:none;flex-direction:column;gap:5px;width:26px;z-index:950;}
.burger span{height:1px;background:var(--cream);width:100%;transition:.35s;}
.burger.open span:nth-child(1){transform:translateY(6px) rotate(45deg);}
.burger.open span:nth-child(2){opacity:0;}
.burger.open span:nth-child(3){transform:translateY(-6px) rotate(-45deg);}
.mobile-menu{position:fixed;inset:0;background:var(--black);z-index:890;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transform:translateY(-100%);transition:transform .6s var(--ease);}
.mobile-menu.open{transform:translateY(0);}
.mobile-menu a{font-family:var(--font-display);font-size:24px;color:var(--cream);}

/* ================= HERO ================= */
.hero{position:relative;height:100vh;min-height:680px;display:flex;align-items:center;overflow:hidden;background:radial-gradient(circle at 50% 15%,#1c1a12 0%,#08090a 65%);perspective:1200px;}
.hero-bg-glow{position:absolute;inset:-20%;background:radial-gradient(circle at 28% 30%,rgba(201,162,74,.14),transparent 45%),radial-gradient(circle at 76% 72%,rgba(120,90,30,.16),transparent 50%);animation:driftGlow 16s ease-in-out infinite alternate;}
@keyframes driftGlow{0%{transform:translate(-2%,-1%) scale(1);}100%{transform:translate(3%,2%) scale(1.08);}}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(201,162,74,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(201,162,74,.05) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(circle at 50% 40%,black,transparent 72%);-webkit-mask-image:radial-gradient(circle at 50% 40%,black,transparent 72%);}
.hero-particles{position:absolute;inset:0;pointer-events:none;}
.particle{position:absolute;border-radius:50%;background:var(--gold-bright);box-shadow:0 0 10px 2px rgba(240,205,122,.55);opacity:0;animation:floatParticle linear infinite;}
@keyframes floatParticle{0%{transform:translateY(0);opacity:0;}10%{opacity:.75;}90%{opacity:.4;}100%{transform:translateY(-108vh);opacity:0;}}

.hero-orbit{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:min(46vw,520px);height:min(46vw,520px);transform-style:preserve-3d;animation:heroFadeIn 1.6s var(--ease) .3s both;}
@media(max-width:900px){.hero-orbit{right:50%;transform:translate(50%,-46%);opacity:.4;width:70vw;height:70vw;}}
@keyframes heroFadeIn{from{opacity:0;transform:translateY(-40%);}to{opacity:1;transform:translateY(-50%);}}
.plate{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--gold-dim),var(--gold-bright),var(--gold-dim),#2a2210,var(--gold-dim));animation:spinPlate 26s linear infinite;box-shadow:0 40px 90px -20px rgba(0,0,0,.85),inset 0 0 60px rgba(0,0,0,.5);}
.plate::before{content:'';position:absolute;inset:10%;border-radius:50%;background:var(--grey-1);box-shadow:inset 0 10px 30px rgba(0,0,0,.7);}
.plate::after{content:'MUSA';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-size:15px;letter-spacing:8px;color:var(--gold-bright);}
@keyframes spinPlate{to{transform:rotate(360deg);}}
.orbit-ring{position:absolute;border:1px solid rgba(201,162,74,.25);border-radius:50%;}
.orbit-ring.r1{inset:-8%;animation:spinPlate 40s linear infinite reverse;}
.orbit-ring.r2{inset:-18%;border-style:dashed;animation:spinPlate 60s linear infinite;}
.orbit-food{position:absolute;width:62px;height:62px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--glass-border);box-shadow:0 20px 40px rgba(0,0,0,.5);animation:floatY 5s ease-in-out infinite;}
.orbit-food.f1{top:-4%;left:8%;animation-delay:0s;}
.orbit-food.f2{top:35%;right:-8%;animation-delay:.8s;}
.orbit-food.f3{bottom:2%;left:0;animation-delay:1.6s;}
.orbit-food.f4{bottom:22%;right:6%;animation-delay:2.4s;}
@keyframes floatY{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-18px) rotate(6deg);}}

.hero-content{position:relative;z-index:5;max-width:660px;}
.hero-content .eyebrow{animation:fadeUp .9s var(--ease) .2s both;}
.hero-title{font-family:var(--font-display);font-size:clamp(42px,7vw,84px);font-weight:800;line-height:1.02;letter-spacing:.5px;animation:fadeUp .9s var(--ease) .4s both;}
.hero-title em{display:block;font-family:var(--font-script);font-style:italic;font-weight:500;color:var(--gold-bright);font-size:1.05em;}
.hero-desc{margin-top:24px;color:var(--cream-dim);font-size:16px;line-height:1.85;max-width:480px;font-weight:300;animation:fadeUp .9s var(--ease) .6s both;}
.hero-actions{display:flex;gap:16px;margin-top:38px;flex-wrap:wrap;animation:fadeUp .9s var(--ease) .8s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(26px);}to{opacity:1;transform:translateY(0);}}
.btn{display:inline-flex;align-items:center;gap:10px;padding:16px 34px;font-size:12px;letter-spacing:2px;text-transform:uppercase;border-radius:2px;transition:.45s var(--ease);position:relative;overflow:hidden;}
.btn-gold{background:var(--gold);color:var(--black);font-weight:600;}
.btn-gold:hover{background:var(--gold-bright);transform:translateY(-3px);box-shadow:0 18px 34px -12px rgba(201,162,74,.55);}
.btn-outline{border:1px solid rgba(239,230,210,.35);color:var(--cream);}
.btn-outline:hover{border-color:var(--gold);color:var(--gold-bright);transform:translateY(-3px);}
.hero-scroll{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:10px;z-index:5;animation:fadeUp .9s var(--ease) 1.1s both;}
.hero-scroll span{font-size:10px;letter-spacing:3px;color:var(--gold-dim);text-transform:uppercase;}
.scroll-line{width:1px;height:44px;background:linear-gradient(var(--gold),transparent);position:relative;overflow:hidden;}
.scroll-line::after{content:'';position:absolute;top:-100%;left:0;width:100%;height:100%;background:var(--gold-bright);animation:scrollDrip 2s ease-in-out infinite;}
@keyframes scrollDrip{to{top:100%;}}

/* ================= MARQUEE STRIP ================= */
.marquee-strip{background:var(--grey-2);border-top:1px solid rgba(201,162,74,.15);border-bottom:1px solid rgba(201,162,74,.15);padding:16px 0;overflow:hidden;white-space:nowrap;position:relative;z-index:2;}
.marquee-track{display:inline-flex;gap:50px;animation:marquee 26s linear infinite;}
.marquee-track span{font-family:var(--font-display);font-style:italic;font-size:15px;color:var(--gold-dim);letter-spacing:1px;display:inline-flex;align-items:center;gap:50px;}
.marquee-track span i{color:var(--gold);font-style:normal;}
@keyframes marquee{from{transform:translateX(0);}to{transform:translateX(-50%);}}

/* ================= ABOUT ================= */
.about{background:linear-gradient(180deg,var(--black),var(--grey-1) 40%,var(--black));}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center;}
@media(max-width:900px){.about-grid{grid-template-columns:1fr;gap:50px;}}
.about-visual{position:relative;height:460px;perspective:1000px;}
@media(max-width:900px){.about-visual{height:360px;}}
.about-card{position:absolute;border-radius:6px;overflow:hidden;box-shadow:0 40px 70px -20px rgba(0,0,0,.7);border:1px solid var(--glass-border);}
.about-card.main{width:78%;height:88%;left:0;top:6%;background:linear-gradient(150deg,var(--grey-2),var(--grey-3));display:flex;align-items:center;justify-content:center;transform:rotateY(-6deg) rotateX(2deg);transition:transform .6s var(--ease);}
.about-visual:hover .about-card.main{transform:rotateY(0) rotateX(0);}
.about-card.main .glyph{font-size:110px;filter:drop-shadow(0 20px 30px rgba(0,0,0,.6));}
.about-card.floaty{width:42%;height:42%;right:-4%;bottom:0;background:linear-gradient(150deg,var(--gold-dim),#3a2f14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;animation:floatY 6s ease-in-out infinite;z-index:3;}
.about-card.floaty b{font-family:var(--font-display);font-size:30px;color:var(--black);}
.about-card.floaty small{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(8,9,10,.75);}
.about-ring{position:absolute;width:130px;height:130px;border:1px solid var(--gold-dim);border-radius:50%;top:-10%;left:-8%;z-index:0;animation:spinPlate 50s linear infinite;}
.about-text .section-sub{margin-top:22px;}
.about-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px;}
.stat b{display:block;font-family:var(--font-display);font-size:34px;color:var(--gold-bright);}
.stat span{font-size:11px;letter-spacing:1.5px;color:var(--cream-dim);text-transform:uppercase;}

/* ================= WHY CHOOSE US ================= */
.why{background:var(--black);}
.why-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px;margin-top:60px;}
@media(max-width:980px){.why-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.why-grid{grid-template-columns:1fr;}}
.why-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:8px;padding:38px 26px;text-align:center;backdrop-filter:blur(6px);transition:.5s var(--ease);transform-style:preserve-3d;position:relative;}
.why-card:hover{transform:translateY(-10px) rotateX(4deg);border-color:var(--gold);box-shadow:0 30px 50px -20px rgba(0,0,0,.6);}
.why-icon{width:62px;height:62px;border-radius:50%;border:1px solid var(--gold-dim);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;font-size:26px;color:var(--gold-bright);}
.why-card h3{font-family:var(--font-display);font-size:19px;margin-bottom:10px;color:var(--cream);}
.why-card p{font-size:13.5px;color:var(--cream-dim);line-height:1.75;font-weight:300;}

/* ================= FEATURED ================= */
.featured{background:linear-gradient(180deg,var(--black),var(--grey-1));}
.feat-track-wrap{margin-top:60px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;}
.feat-track-wrap::-webkit-scrollbar{display:none;}
.feat-track{display:flex;gap:26px;padding-bottom:10px;}
.feat-card{flex:0 0 280px;background:linear-gradient(160deg,var(--grey-2),var(--grey-1));border:1px solid var(--glass-border);border-radius:10px;padding:0;overflow:hidden;position:relative;transition:.55s var(--ease);}
.feat-card:hover{transform:translateY(-12px);box-shadow:0 40px 60px -22px rgba(0,0,0,.7);border-color:var(--gold);}
.feat-media{height:190px;display:flex;align-items:center;justify-content:center;font-size:64px;background:radial-gradient(circle at 30% 20%,rgba(201,162,74,.18),transparent 60%),var(--grey-3);position:relative;}
.feat-media::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(8,9,10,.9));}
.feat-tag{position:absolute;top:14px;left:14px;background:var(--gold);color:var(--black);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;padding:5px 12px;border-radius:20px;z-index:2;font-weight:600;}
.feat-body{padding:22px 22px 26px;}
.feat-body h3{font-family:var(--font-display);font-size:20px;color:var(--cream);margin-bottom:8px;}
.feat-body p{font-size:12.5px;color:var(--cream-dim);line-height:1.6;font-weight:300;margin-bottom:16px;}
.feat-price{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed rgba(201,162,74,.25);padding-top:14px;}
.feat-price .price{font-family:var(--font-display);font-size:20px;color:var(--gold-bright);}

/* ================= MENU ================= */
.menu-section{background:var(--black);position:relative;}
.menu-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-top:50px;margin-bottom:10px;}
.menu-tab{padding:10px 20px;font-size:11.5px;letter-spacing:1.5px;text-transform:uppercase;border:1px solid rgba(239,230,210,.18);border-radius:30px;color:var(--cream-dim);transition:.35s var(--ease);white-space:nowrap;}
.menu-tab:hover{border-color:var(--gold);color:var(--gold-bright);}
.menu-tab.active{background:var(--gold);border-color:var(--gold);color:var(--black);font-weight:600;}
.menu-search{margin-top:24px;position:relative;max-width:420px;}
.menu-search input{width:100%;background:var(--glass);border:1px solid var(--glass-border);border-radius:30px;padding:14px 46px 14px 22px;color:var(--cream);font-family:var(--font-body);font-size:13px;outline:none;transition:.3s;}
.menu-search input:focus{border-color:var(--gold);}
.menu-search input::placeholder{color:var(--cream-dim);}
.menu-search .ic{position:absolute;right:18px;top:50%;transform:translateY(-50%);color:var(--gold-dim);font-size:15px;}

.menu-category{margin-top:64px;}
.menu-cat-head{display:flex;align-items:baseline;gap:18px;margin-bottom:30px;}
.menu-cat-head h3{font-family:var(--font-display);font-size:clamp(22px,3vw,30px);color:var(--gold-bright);white-space:nowrap;}
.menu-cat-head .line{height:1px;width:100%;background:linear-gradient(90deg,rgba(201,162,74,.4),transparent);}
.menu-cat-note{font-size:11.5px;color:var(--cream-dim);letter-spacing:1px;text-transform:uppercase;margin:-20px 0 26px;opacity:.8;}

.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;}
.menu-card{
  background:var(--glass);border:1px solid var(--glass-border)
